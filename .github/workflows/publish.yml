name: Publish to Marketplace

on:
  push:
    branches:
      - main

# Prevent two publish jobs from running at the same time
concurrency:
  group: marketplace-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Get VSIX Version
        id: vsix_version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content "source.extension.vsixmanifest"
          $version = $manifest.PackageManifest.Metadata.Identity.Version

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read version from source.extension.vsixmanifest"
          }

          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "FINAL_VERSION=$version" >> $env:GITHUB_ENV

      - name: Verify VSIX Exists
        shell: pwsh
        run: |
          if (!(Test-Path "bin/Release/MatrixUltrA12.vsix")) {
            throw "VSIX file not found: bin/Release/MatrixUltrA12.vsix"
          }

      - name: Publish to Marketplace (with retry)
        shell: pwsh
        env:
          VS_PAT: ${{ secrets.VS_PUBLISHER_ACCESS_TOKEN }}
        run: |
          $vsixPublisher = "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\vssdk\VisualStudioIntegration\tools\bin\VsixPublisher.exe"

          if (!(Test-Path $vsixPublisher)) {
          throw "VsixPublisher.exe not found: $vsixPublisher"
          }

          $maxAttempts = 10
          $waitSeconds = 90

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          Write-Host "Publish attempt $attempt of $maxAttempts"

          & $vsixPublisher `
          publish `
          -payload "bin/Release/MatrixUltrA12.vsix" `
          -publishManifest "publish-manifest.json" `
          -personalAccessToken $env:VS_PAT

          if ($LASTEXITCODE -eq 0) {
          Write-Host "Marketplace publish succeeded."
          exit 0
          }

           if ($LASTEXITCODE -eq 29 -and $attempt -lt $maxAttempts) {
           Write-Host "Marketplace is busy (VsixPub0029). Waiting $waitSeconds seconds before retry..."
           Start-Sleep -Seconds $waitSeconds
           continue
           }

          throw "Marketplace publish failed with exit code $LASTEXITCODE"
          }

          throw "Marketplace publish failed after $maxAttempts attempts."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FINAL_VERSION }}
          name: Release v${{ env.FINAL_VERSION }}
          files: bin/Release/MatrixUltrA12.vsix
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}