name: Publish to Marketplace
on:
  push:
    branches: [ main ]

permissions:
  contents: write  

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true 

      - name: Get VSIX Version
        id: vsix_version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content source.extension.vsixmanifest
          $version = $manifest.PackageManifest.Metadata.Identity.Version
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Generate Version Badge
        shell: pwsh
        run: |
          $v = "${{ steps.vsix_version.outputs.version }}"

          $url = "https://shields.io"
          Invoke-WebRequest -Uri $url -OutFile "version-badge.png" -UserAgent "Mozilla/5.0"
          echo "FINAL_VERSION=$v" >> $env:GITHUB_ENV

      - name: Sync Badge Asset
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"     
          git add version-badge.png
          git commit -m "chore: update release version badge asset [skip ci]" || echo "No changes"
          git push origin main

      - name: Publish to Marketplace
        uses: CodingWithCalvin/GHA-VSMarketplacePublisher@v2.0.0
        with:
          marketplace-pat: ${{ secrets.VS_PUBLISHER_ACCESS_TOKEN }}
          vsix-path: 'bin/Release/MatrixUltrA12.vsix'
          publish-manifest-path: 'publish-manifest.json' 

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FINAL_VERSION }}
          name: Release v${{ env.FINAL_VERSION }}
          files: 'bin/Release/MatrixUltrA12.vsix'
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}