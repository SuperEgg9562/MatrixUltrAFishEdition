name: Publish to Marketplace

on:
  push:
    branches:
      - main

# Prevent two publish jobs from running at the same time
concurrency:
  group: marketplace-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Get VSIX Version
        id: vsix_version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content "source.extension.vsixmanifest"
          $version = $manifest.PackageManifest.Metadata.Identity.Version

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read version from source.extension.vsixmanifest"
          }

          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "FINAL_VERSION=$version" >> $env:GITHUB_ENV

      - name: Verify VSIX Exists
        shell: pwsh
        run: |
          if (!(Test-Path "bin/Release/MatrixUltrA12.vsix")) {
            throw "VSIX file not found: bin/Release/MatrixUltrA12.vsix"
          }

      - name: Publish to Marketplace
        uses: CodingWithCalvin/GHA-VSMarketplacePublisher@v2.0.0
        with:
          marketplace-pat: ${{ secrets.VS_PUBLISHER_ACCESS_TOKEN }}
          vsix-path: bin/Release/MatrixUltrA12.vsix
          publish-manifest-path: publish-manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FINAL_VERSION }}
          name: Release v${{ env.FINAL_VERSION }}
          files: bin/Release/MatrixUltrA12.vsix
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}