name: Publish to Marketplace

on:
  push:
    branches:
      - main

concurrency:
  group: marketplace-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Get VSIX Version
        id: vsix_version
        shell: pwsh
        run: |
          if (!(Test-Path "bin/Release/MatrixUltrA12.vsix")) {
            throw "VSIX file not found: bin/Release/MatrixUltrA12.vsix"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zip = [System.IO.Compression.ZipFile]::OpenRead("bin/Release/MatrixUltrA12.vsix")

          try {
            $entry = $zip.Entries |
              Where-Object { $_.FullName -eq "extension.vsixmanifest" } |
              Select-Object -First 1

            if (-not $entry) {
              throw "extension.vsixmanifest not found inside the VSIX."
            }

            $reader = New-Object System.IO.StreamReader($entry.Open())
            [xml]$manifest = $reader.ReadToEnd()
            $reader.Close()

            $version = $manifest.PackageManifest.Metadata.Identity.Version

            if ([string]::IsNullOrWhiteSpace($version)) {
              throw "Could not read version from extension.vsixmanifest."
            }

            Write-Host "Detected VSIX version: $version"

            echo "version=$version" >> $env:GITHUB_OUTPUT
            echo "FINAL_VERSION=$version" >> $env:GITHUB_ENV
          }
          finally {
            $zip.Dispose()
          }

      - name: Verify VSIX Exists
        shell: pwsh
        run: |
          if (!(Test-Path "bin/Release/MatrixUltrA12.vsix")) {
            throw "VSIX file not found: bin/Release/MatrixUltrA12.vsix"
          }

      - name: Verify VSIX Manifest Compatibility
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zip = [System.IO.Compression.ZipFile]::OpenRead("bin/Release/MatrixUltrA12.vsix")

          try {
            $entry = $zip.Entries |
              Where-Object { $_.FullName -eq "extension.vsixmanifest" } |
              Select-Object -First 1

            if (-not $entry) {
              throw "extension.vsixmanifest not found inside the VSIX."
            }

            $reader = New-Object System.IO.StreamReader($entry.Open())
            [xml]$manifest = $reader.ReadToEnd()
            $reader.Close()

            $targets = @($manifest.PackageManifest.Installation.InstallationTarget)

            foreach ($target in $targets) {
              Write-Host "VSIX installation target: Id=$($target.Id), Version=$($target.Version)"

              if ($target.Version -match "^\[18\.0,") {
                throw "The VSIX payload still targets experimental API version 18.0. Rebuild MatrixUltrA12.vsix in Visual Studio after updating source.extension.vsixmanifest to [17.14,19.0)."
              }
            }
          }
          finally {
            $zip.Dispose()
          }

      - name: Verify VSIX Version Is New
        shell: pwsh
        run: |
          $tagName = "v${{ env.FINAL_VERSION }}"
          $existingTag = git tag --list $tagName

          if ($existingTag -eq $tagName) {
            throw "Version ${{ env.FINAL_VERSION }} is already tagged as $tagName. Rebuild the VSIX with a newer version before publishing."
          }

      - name: Publish to Marketplace (with retry)
        shell: pwsh
        env:
          VS_PAT: ${{ secrets.VS_PUBLISHER_ACCESS_TOKEN }}
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -property installationPath

          if ([string]::IsNullOrWhiteSpace($vsPath)) {
            throw "Visual Studio installation not found."
          }

          $vsixPublisher = Join-Path $vsPath `
            "VSSDK\VisualStudioIntegration\Tools\Bin\VsixPublisher.exe"

          if (!(Test-Path $vsixPublisher)) {
            throw "VsixPublisher.exe not found: $vsixPublisher"
          }

          $maxAttempts = 3
          $waitSeconds = 30

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Publish attempt $attempt of $maxAttempts"

            $publishOutput = & $vsixPublisher `
              publish `
              -payload "bin/Release/MatrixUltrA12.vsix" `
              -publishManifest "publish-manifest.json" `
              -personalAccessToken $env:VS_PAT 2>&1

            $publishOutput | ForEach-Object { Write-Host $_ }

            $exitCode = $LASTEXITCODE

            if ($exitCode -eq 0) {
              Write-Host "Marketplace publish succeeded."
              break
            }

            $publishText = $publishOutput -join "`n"

            if ($publishText -match "experimental" -or $publishText -match "not allowed in the Marketplace") {
              throw "Marketplace publish failed because the VSIX manifest uses an installation target API version that Marketplace does not allow."
            }

            if ($exitCode -eq 29 -and $attempt -lt $maxAttempts) {
              Write-Host "Marketplace is busy (VsixPub0029). Waiting $waitSeconds seconds before retry..."
              Start-Sleep -Seconds $waitSeconds
              continue
            }

            throw "Marketplace publish failed with exit code $exitCode"
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FINAL_VERSION }}
          name: Release v${{ env.FINAL_VERSION }}
          files: bin/Release/MatrixUltrA12.vsix
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
