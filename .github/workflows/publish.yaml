name: Publish Extension to Marketplace

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build Extension 
        run: dotnet build MatrixUltrA12.slnx /p:Configuration=Release /p:DeployExtension=False

      - name: Publish to Marketplace
        uses: CodingWithCalvin/GHA-VSMarketplacePublisher@v2.0.0
        with:
          marketplace-pat: ${{ secrets.VS_MARKETPLACE_PAT }}
          publish-manifest-path: './publishManifest.json'
          vsix-path: './MatrixUltrA12/bin/Release/MatrixUltrA12.vsix'
